<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SpendWise helps you calculate your budget and remaining balance.">
  <title>SpendWise | Budget Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <section class="calculator">
      <p class="eyebrow">SMART MONEY HABITS</p>
      <h1>SpendWise</h1>
      <h2>Budget Calculator</h2>
      <p class="intro">Know where your money goes. Enter your monthly budget and expenses to see what remains.</p>
      <button id="calculate-button" type="button">Calculate my budget</button>
      <p class="hint">Your results will appear in the browser console. Press F12 and choose Console.</p>
    </section>
  </main>
</body>
</html>
